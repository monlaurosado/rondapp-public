<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#06070B" />
    <title>Rondapp · Sin conexión</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #06070b;
        color: #fff7e8;
      }

      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background:
          radial-gradient(circle at 50% 10%, rgba(255, 94, 58, 0.22), transparent 38%),
          linear-gradient(180deg, #06070b, #120b18);
      }

      main {
        width: min(100%, 420px);
        text-align: center;
        padding: 28px;
        box-sizing: border-box;
        border: 1px solid rgba(255, 245, 225, 0.16);
        border-radius: 24px;
        background: rgba(255, 241, 208, 0.075);
      }

      img {
        width: 88px;
        height: 88px;
        border-radius: 24px;
      }

      h1 {
        margin: 20px 0 8px;
        font-size: 28px;
      }

      p {
        margin: 0 0 24px;
        color: #d8d0c5;
        line-height: 1.5;
      }

      button {
        width: 100%;
        min-height: 52px;
        border: 1px solid rgba(255, 184, 77, 0.58);
        border-radius: 16px;
        background: linear-gradient(135deg, #ffb84d, #ff5e3a);
        color: #171008;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-icon-192.png" alt="" />
      <h1>Te has quedado sin conexión</h1>
      <p>Rondapp necesita internet para cargar tus grupos y momentos. Vuelve a intentarlo cuando recuperes la conexión.</p>
      <button type="button" onclick="window.location.reload()">Volver a intentar</button>
    </main>
  </body>
</html>
